# Phase-2 config — swap this in for nginx.conf (see DEPLOY.md) once
# certbot has issued a cert for heail.in. Redirects HTTP to HTTPS and serves
# the app over TLS.

# Rate limiting — keyed per client IP. "auth" is deliberately tight (login,
# OTP send, password reset) since those are exactly the endpoints brute-force
# and spam/email-bombing abuse target; "api" is a much looser backstop for
# everything else so normal use is never affected.
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

server {
    listen 80;
    server_name heail.in www.heail.in;

    # Still needed for certbot renewals (it re-validates over HTTP-01).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name heail.in www.heail.in;
    root /usr/share/nginx/html;
    index index.html;

    # nginx's own default (1MB) sits below the app's multipart ceiling — raised
    # to match spring.servlet.multipart.max-file-size so an oversized upload
    # reaches the backend's friendly "Attached file is more than 500 KB"
    # message instead of nginx rejecting it first with a raw error page.
    client_max_body_size 5m;

    ssl_certificate     /etc/letsencrypt/live/heail.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/heail.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers — sent on every response, static assets included.
    # HSTS tells browsers to only ever reach this origin over HTTPS from now
    # on (even if someone types http:// or an old bookmark points there).
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Auth-sensitive endpoints (login, OTP send, password reset) get a much
    # tighter rate limit than general API traffic — see the limit_req_zone
    # comment above. burst=5 lets a real user's occasional double-click or
    # retry through without tripping it; sustained hammering past that gets 503s.
    location ~ ^/api/v1/(auth/login|auth/register/send-otp|auth/forgot-password|auth/reset-password|partners/send-otp|contact/send-otp|me/profile/send-otp) {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
