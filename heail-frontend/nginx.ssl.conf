# Phase-2 config — swap this in for nginx.conf (see DEPLOY.md) once
# certbot has issued a cert for heail.in. Redirects HTTP to HTTPS and serves
# the app over TLS.
server {
    listen 80;
    server_name heail.in www.heail.in;

    # Still needed for certbot renewals (it re-validates over HTTP-01).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name heail.in www.heail.in;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/heail.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/heail.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
