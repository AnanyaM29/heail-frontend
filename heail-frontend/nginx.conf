# index.html must never be cached (a deploy changes every hashed JS/CSS name);
# the hashed assets themselves are safe to cache forever.
map $uri $cache_ctrl {
    default                                                              "no-store, must-revalidate";
    "~*\.(?:js|css|mjs|woff2?|ttf|eot|otf|map|png|jpe?g|gif|svg|webp|ico)$"  "public, max-age=31536000, immutable";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    add_header Cache-Control $cache_ctrl always;

    # nginx's own default (1MB) sits below the app's multipart ceiling — raised
    # to match spring.servlet.multipart.max-file-size so an oversized upload
    # reaches the backend's friendly "Attached file is more than 500 KB"
    # message instead of nginx rejecting it first with a raw error page.
    client_max_body_size 5m;

    # Required for certbot's HTTP-01 challenge (both initial issuance and
    # renewal) to reach this container — see DEPLOY.md. Works whether or not
    # a cert exists yet, so it's harmless to leave in place permanently.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Forward API calls to the backend container (Docker Compose service name
    # "backend" resolves via the compose network's internal DNS).
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # A missing hashed asset must 404, not fall through to index.html.
    location ~* \.(?:js|css|mjs|woff2?|ttf|eot|otf|map)$ {
        try_files $uri =404;
    }

    # Angular SPA fallback — unknown paths (client-side routes) serve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
