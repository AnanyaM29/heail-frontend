server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Required for certbot's HTTP-01 challenge (both initial issuance and
    # renewal) to reach this container — see DEPLOY.md. Works whether or not
    # a cert exists yet, so it's harmless to leave in place permanently.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Forward API calls to the backend container (Docker Compose service name
    # "backend" resolves via the compose network's internal DNS).iii
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Angular SPA fallback — unknown paths (client-side routes) serve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
